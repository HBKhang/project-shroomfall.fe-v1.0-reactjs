<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment successful | Shroomfall</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/payment/payment.css" />
  </head>
  <body>
    <!-- Static PayOS return page: served by Vercel before the SPA rewrite, so no login is needed. -->
    <main>
      <section class="card success">
        <div class="brand"><span class="material-symbols-outlined">pets</span>SHROOMFALL</div>
        <div class="icon"><span class="material-symbols-outlined">check_circle</span></div>
        <span class="badge">Success</span>
        <h1>Payment successful</h1>
        <p>Your payment was completed. You can return to the game now.</p>
        <button type="button" onclick="history.length > 1 && history.back()">
          Return to game <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </section>
    </main>
  </body>
</html>
